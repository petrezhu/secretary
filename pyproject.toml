[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secretary"
version = "0.1.0"
description = "Personal digital assistant — full-time daemon for monitoring, coaching, and notification"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "psutil>=5.9",
    "aiohttp>=3.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.scripts]
secretary = "secretary.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secretary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N806"]
"src/secretary/gateway/adapters.py" = ["SIM117"]
"src/secretary/wealth/eastmoney_sync.py" = ["SIM102"]
