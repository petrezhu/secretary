<svg viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e5e5" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-down" markerWidth="10" markerHeight="10" refX="5" refY="10" orient="auto">
      <path d="M0,0 L10,0 L5,10 z" fill="#aaa"/>
    </marker>
    <linearGradient id="gw-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3498db" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3498db" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="harness-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9b59b6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#9b59b6" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="data-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#27ae60" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#27ae60" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="notify-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e67e22" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e67e22" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="520" fill="#fafafa"/>
  <rect width="820" height="520" fill="url(#grid)"/>

  <!-- Title -->
  <text x="40" y="35" font-size="14" fill="#333" font-weight="bold">SECRETARY — 架构概览</text>
  <text x="310" y="35" font-size="11" fill="#888">[ 分层架构 ]</text>

  <!-- ===== 网关层 ===== -->
  <rect x="40" y="55" rx="6" ry="6" width="740" height="65" fill="url(#gw-grad)" stroke="#3498db" stroke-width="1.5"/>
  <text x="410" y="78" font-size="13" fill="#3498db" text-anchor="middle" font-weight="bold">网关层 (Gateway)</text>
  <text x="410" y="96" font-size="10" fill="#666" text-anchor="middle">FastAPI 服务 · 意图路由 · 适配器注册表 · /api/inbound</text>
  <text x="750" y="78" font-size="9" fill="#999" text-anchor="end">gateway/</text>

  <!-- Arrow -->
  <line x1="410" y1="120" x2="410" y2="140" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow-down)"/>

  <!-- ===== 引擎抽象层 ===== -->
  <rect x="40" y="140" rx="6" ry="6" width="740" height="55" fill="url(#harness-grad)" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="410" y="163" font-size="13" fill="#9b59b6" text-anchor="middle" font-weight="bold">引擎抽象层 (Harness)</text>
  <text x="410" y="180" font-size="10" fill="#666" text-anchor="middle">Agent 执行引擎抽象 · HermesHarness · CLI Proxy API</text>
  <text x="750" y="163" font-size="9" fill="#999" text-anchor="end">harness/</text>

  <!-- Arrow -->
  <line x1="410" y1="195" x2="410" y2="215" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow-down)"/>

  <!-- ===== 核心模块（四列） ===== -->
  <rect x="40" y="215" rx="6" ry="6" width="740" height="145" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 监控层 -->
  <rect x="55" y="228" rx="5" ry="5" width="165" height="120" fill="#e74c3c" fill-opacity="0.06" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="137" y="248" font-size="12" fill="#e74c3c" text-anchor="middle" font-weight="bold">监控层</text>
  <text x="137" y="268" font-size="9" fill="#666" text-anchor="middle">健康检查</text>
  <text x="137" y="283" font-size="9" fill="#666" text-anchor="middle">死人开关</text>
  <text x="137" y="298" font-size="9" fill="#666" text-anchor="middle">资源守护</text>
  <text x="137" y="318" font-size="8" fill="#999" text-anchor="middle">monitor/</text>

  <!-- 引擎层 -->
  <rect x="235" y="228" rx="5" ry="5" width="165" height="120" fill="#3498db" fill-opacity="0.06" stroke="#3498db" stroke-width="1.2"/>
  <text x="317" y="248" font-size="12" fill="#3498db" text-anchor="middle" font-weight="bold">引擎层</text>
  <text x="317" y="268" font-size="9" fill="#666" text-anchor="middle">调度器 (30s tick)</text>
  <text x="317" y="283" font-size="9" fill="#666" text-anchor="middle">自动修复</text>
  <text x="317" y="298" font-size="9" fill="#666" text-anchor="middle">审计日志</text>
  <text x="317" y="318" font-size="8" fill="#999" text-anchor="middle">engine/</text>

  <!-- 督导层 -->
  <rect x="415" y="228" rx="5" ry="5" width="165" height="120" fill="#f39c12" fill-opacity="0.06" stroke="#f39c12" stroke-width="1.2"/>
  <text x="497" y="248" font-size="12" fill="#f39c12" text-anchor="middle" font-weight="bold">督导层</text>
  <text x="497" y="268" font-size="9" fill="#666" text-anchor="middle">能量评估</text>
  <text x="497" y="283" font-size="9" fill="#666" text-anchor="middle">焦点选择</text>
  <text x="497" y="298" font-size="9" fill="#666" text-anchor="middle">逾期检测 · 感知引擎</text>
  <text x="497" y="318" font-size="8" fill="#999" text-anchor="middle">coach/</text>

  <!-- 财富引擎 -->
  <rect x="595" y="228" rx="5" ry="5" width="170" height="120" fill="#27ae60" fill-opacity="0.06" stroke="#27ae60" stroke-width="1.2"/>
  <text x="680" y="248" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="bold">财富引擎</text>
  <text x="680" y="268" font-size="9" fill="#666" text-anchor="middle">持仓快照</text>
  <text x="680" y="283" font-size="9" fill="#666" text-anchor="middle">板块分析</text>
  <text x="680" y="298" font-size="9" fill="#666" text-anchor="middle">QDII · 风控决策</text>
  <text x="680" y="318" font-size="8" fill="#999" text-anchor="middle">wealth/</text>

  <!-- Arrow -->
  <line x1="410" y1="360" x2="410" y2="380" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow-down)"/>

  <!-- ===== 数据层 ===== -->
  <rect x="40" y="380" rx="6" ry="6" width="740" height="50" fill="url(#data-grad)" stroke="#27ae60" stroke-width="1.5"/>
  <text x="410" y="403" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="bold">数据层 (Data)</text>
  <text x="410" y="418" font-size="10" fill="#666" text-anchor="middle">Repository · goals.db · tasks.db · Obsidian 知识库</text>
  <text x="750" y="403" font-size="9" fill="#999" text-anchor="end">data/</text>

  <!-- Arrow -->
  <line x1="410" y1="430" x2="410" y2="448" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow-down)"/>

  <!-- ===== 通知层 ===== -->
  <rect x="40" y="448" rx="6" ry="6" width="740" height="50" fill="url(#notify-grad)" stroke="#e67e22" stroke-width="1.5"/>
  <text x="410" y="471" font-size="13" fill="#e67e22" text-anchor="middle" font-weight="bold">通知层 (Notify)</text>
  <text x="410" y="486" font-size="10" fill="#666" text-anchor="middle">消息分发器 · QQ Bot 适配器 · Email 适配器 · 按级别路由</text>
  <text x="750" y="471" font-size="9" fill="#999" text-anchor="end">notify/</text>

  <!-- Bottom note -->
  <text x="410" y="512" font-size="9" fill="#999" text-anchor="middle">规则优先架构 — 确定性业务逻辑消耗 0 LLM token</text>
</svg>
